<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    min-height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 900px;
    padding: 10px;
}

.video {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    display: block;
    border-radius: 10px;
}

button {
    width: 100%;
    margin-top: 10px;
    min-height: 52px;
    border: 0;
    border-radius: 10px;
    background: #ff0033;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}
</style>
</head>

<body>

<div class="container">

    <iframe
        class="video"
        src="https://www.youtube.com/embed/I2mSO1zzsfA?rel=0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

    <button onclick="openYouTube()">
        🙏🏻 जय माँ शारदा 🙏🏻
    </button>

</div>

<script>
function openYouTube() {
    window.location.href =
        "https://www.youtube.com/watch?v=I2mSO1zzsfA";
}
</script>

</body>
</html>
