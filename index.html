<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>जय माँ शारदा</title>

<style>
:root {
  color-scheme: light dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
}

body {
  background: light-dark(#f7f7f7, #0f0f0f);
}

#app {
  min-height: 100vh;
  width: 100%;
  background: light-dark(#f7f7f7, #0f0f0f);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

.wrap {
  width: min(100%, 900px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 10px;
  background: #000;
}

.actions {
  display: grid;
  grid-template-columns: 1fr;
}

button {
  appearance: none;
  border: 0;
  border-radius: 10px;
  min-height: 54px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  background: #ff0033;
  color: #fff;
  transition: transform 0.1s;
}

button:active {
  transform: scale(0.98);
}

@media (max-width: 520px) {
  #app {
    padding: 8px;
    align-items: flex-start;
    padding-top: 10px;
  }

  .wrap {
    gap: 8px;
  }

  button {
    min-height: 52px;
    font-size: 17px;
  }
}
</style>
</head>

<body>

<div id="app">
  <main class="wrap">

    <iframe
      class="video"
      src="https://www.youtube.com/embed/I2mSO1zzsfA?rel=0"
      title="YouTube video"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>

    <div class="actions">
      <button type="button" onclick="openYouTube()">
        🙏🏻 जय माँ शारदा 🙏🏻
      </button>
    </div>

  </main>
</div>

<script>
const videoUrl = "https://www.youtube.com/watch?v=I2mSO1zzsfA";

function openYouTube() {
  window.open(videoUrl, "_blank", "noopener");
}
</script>

</body>
</html>
